  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link
    href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <meta name="theme-color" content="#0A5DAA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <meta name="description" content="HorCare - ระบบจัดการหอพักอัจฉริยะ จดมิเตอร์ คํานวณค่าเช่า ออกบิลอัตโนมัติ" />
  <meta property="og:title" content="HorCare - ระบบจัดการหอพักอัจฉริยะ" />
  <meta property="og:description"
    content="ระบบจัดการหอพักที่ช่วยให้คุณทำงานง่ายขึ้น จดมิเตอร์ผ่านมือถือ คำนวณค่าไฟ-น้ำอัตโนมัติ พร้อมออกบิลได้ทันที" />

  <!-- Security: prevent clickjacking, XSS -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
  <script>
    window.__pwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
    });
  </script>
  <style>
    body { margin: 0; background-color: #0A5DAA; font-family: 'Anuphan', sans-serif; }
    .splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: #0A5DAA;
    }
    .splash-logo-container img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      animation: splash-breathe 1.6s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate;
    }
    @keyframes splash-breathe {
      from { transform: scale(0.96); opacity: 0.75; }
      to { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-logo-container img { animation: none; }
    }
    .splash-text {
      margin-top: 1.25rem;
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="splash-screen">
      <div class="splash-logo-container">
        <img src="/logo.png?v=2" alt="HorCare" />
      </div>
      <div class="splash-text">กำลังโหลด...</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
