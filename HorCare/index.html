  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <meta name="theme-color" content="#0284C7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HorCare" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="HorCare" />
  <meta name="msapplication-TileColor" content="#0284C7" />
  <meta name="format-detection" content="telephone=no" />

  <meta name="description" content="HorCare - ระบบจัดการหอพักอัจฉริยะ จดมิเตอร์ คํานวณค่าเช่า ออกบิลอัตโนมัติ" />
  <meta property="og:title" content="HorCare - ระบบจัดการหอพักอัจฉริยะ" />
  <meta property="og:description"
    content="ระบบจัดการหอพักที่ช่วยให้คุณทำงานง่ายขึ้น จดมิเตอร์ผ่านมือถือ คำนวณค่าไฟ-น้ำอัตโนมัติ พร้อมออกบิลได้ทันที" />

  <!-- Security: prevent clickjacking, XSS -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
  <script>
    window.__pwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
    });
  </script>
  <style>
    body { margin: 0; background-color: #0B0F19; font-family: 'Prompt', sans-serif; }
    .splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at 50% 30%, #0F172A 0%, #080C14 100%);
    }
    .splash-logo-container {
      perspective: 1000px;
      filter: drop-shadow(0 12px 36px rgba(14, 165, 233, 0.25));
    }
    .splash-logo-container img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      animation: cool-spin-entry 2.8s cubic-bezier(0.2, 0.8, 0.2, 1.1) infinite alternate;
      transform-style: preserve-3d;
    }
    @keyframes cool-spin-entry {
      0% { transform: scale(0.85) translateY(0px); opacity: 0.8; filter: drop-shadow(0 4px 12px rgba(14, 165, 233, 0.2)); }
      50% { transform: scale(1.02) translateY(-6px); opacity: 1; filter: drop-shadow(0 14px 28px rgba(16, 185, 129, 0.35)); }
      100% { transform: scale(0.95) translateY(0px); opacity: 0.9; filter: drop-shadow(0 8px 18px rgba(249, 115, 22, 0.25)); }
    }
    .splash-text {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #94A3B8;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="splash-screen">
      <div class="splash-logo-container">
        <img src="/logo.png?v=2" alt="HorCare" />
      </div>
      <div class="splash-text">กำลังโหลด...</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
