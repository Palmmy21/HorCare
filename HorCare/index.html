<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo-icon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <meta name="theme-color" content="#2563EB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>HorCare</title>
  <meta name="description" content="HorCare - ระบบจัดการหอพักอัจฉริยะ จดมิเตอร์ คํานวณค่าเช่า ออกบิลอัตโนมัติ" />
  <meta property="og:title" content="HorCare - ระบบจัดการหอพักอัจฉริยะ" />
  <meta property="og:description"
    content="ระบบจัดการหอพักที่ช่วยให้คุณทำงานง่ายขึ้น จดมิเตอร์ผ่านมือถือ คำนวณค่าไฟ-น้ำอัตโนมัติ พร้อมออกบิลได้ทันที" />
  <meta property="og:image" content="/logo.png" />
  <meta property="og:type" content="website" />

  <!-- Security: prevent clickjacking, XSS -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
  <style>
    body { margin: 0; background-color: #f9fafb; font-family: 'Inter', sans-serif; }
    .splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    .splash-logo-container {
      perspective: 1000px;
    }
    .splash-logo-container img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      animation: cool-spin-entry 3s cubic-bezier(0.2, 0.8, 0.2, 1.1) infinite alternate;
      transform-style: preserve-3d;
    }
    @keyframes cool-spin-entry {
      0% { transform: rotateY(-540deg) scale(0.3); opacity: 0; filter: blur(10px); }
      60% { transform: rotateY(20deg) scale(1.1); opacity: 1; filter: blur(0px); }
      80% { transform: rotateY(-10deg) scale(0.95); }
      100% { transform: rotateY(0deg) scale(1); }
    }
    .splash-text {
      margin-top: 1.5rem;
      font-size: 1rem;
      color: #9ca3af;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="splash-screen">
      <div class="splash-logo-container">
        <img src="/logo.png" alt="HorCare" />
      </div>
      <div class="splash-text">กำลังโหลด...</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
